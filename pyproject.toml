[project]
name = "libephemeris"
version = "3.0.0rc8"
description = "A high-precision, open-source astronomical ephemeris library for Python, powered by Skyfield."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "LICENSING.md",
    "NOTICE.md",
    "THIRD_PARTY_NOTICES.md",
]
authors = [
    { name = "Giacomo Battaglia", email = "kerykeion.astrology@gmail.com" }
]
maintainers = [
    { name = "Giacomo Battaglia", email = "kerykeion.astrology@gmail.com" }
]
keywords = [
    "astronomy",
    "ephemeris",
    "astrology",
    "planetary",
    "skyfield",
    "jpl-de440",
    "astrological",
    "celestial",
    "horoscope",
    "zodiac",
]
classifiers = [
    # Bumped to "5 - Production/Stable" at the v3.0.0 final tag (with the
    # version bump off rc2); kept Beta while the version is a pre-release.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "skyfield>=1.54",  # 1.54: deflectors= arg, 30% faster risings/settings, NumPy array Time subtraction
    "skyfield-data>=7.0.0",
    "certifi",  # SSL certificates for HTTPS connections to JPL Horizons
    "click>=8.0",  # CLI framework for both prod (libephemeris) and dev (leph) commands
    # spktype21 vendored in libephemeris/vendor/spktype21.py (upstream unmaintained since 2018, numpy 2.x fix applied)
    "pyerfa>=2.0.0",  # IAU ERFA: high-precision nutation (IAU 2006/2000A), obliquity, precession, aberration
    "zstandard>=0.22.0",  # Zstandard compression for LEB2 compressed ephemeris format
    # tomllib is in stdlib since 3.11, no longer needed with >=3.12
]

[project.optional-dependencies]
# Star catalog building (scripts/build_star_catalog_v2.py)
stars = [
    "astropy>=5.0.0",
    "astroquery>=0.4.7",
]
# N-body integration for asteroid orbit propagation.
# NOTE: rebound and assist are GPL-3.0-or-later (provenance-ok). Installing this extra
# brings copyleft-licensed components into the environment; the core
# package and every other extra stay permissive-only. Opt in explicitly
# with `libephemeris[nbody]`.
nbody = [
    "rebound>=4.0.0",
    "assist>=1.1.0",
]
# All permissive-licensed optional runtime features. Deliberately does NOT
# include the GPL-licensed N-body extra (rebound/assist) (provenance-ok): install
# `libephemeris[all,nbody]` if you also want that and accept its license.
all = [
    "astropy>=5.0.0",
]
dev = [
    "black>=25.1.0",
    "mypy>=1.0.0",
    "poethepoet>=0.37.0,<0.38.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.14.6",
    "pytest-cov>=6.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pytest-sugar>=1.1.1",
    "hypothesis>=6.0.0",
    "spiceypy>=6.0.0",  # For generating compact planet center SPK files
    "astropy>=5.0.0",  # Cross-validation against professional astronomy standards (dev only)
    "astroquery>=0.4.7",  # Catalog-building and validation scripts
    "ebooklib>=0.20",  # EPUB generation for manual (scripts/generate_manual_epub.py)
    "markdown>=3.7",  # Markdown-to-HTML for EPUB manual generation
    "pyyaml>=6.0",  # YAML metadata parsing for EPUB manual generation
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/g-battaglia/libephemeris"
Documentation = "https://github.com/g-battaglia/libephemeris#readme"
Repository = "https://github.com/g-battaglia/libephemeris"
Issues = "https://github.com/g-battaglia/libephemeris/issues"
Changelog = "https://github.com/g-battaglia/libephemeris/blob/main/CHANGELOG.md"

[project.scripts]
libephemeris = "libephemeris.cli:main"
# leph (the dev CLI) is repo tooling with repo-relative paths and is
# deliberately NOT shipped in the wheel.  From a source checkout use
# ./leph, `python -m libephemeris.dev_cli`, or `poe leph -- <args>`.



[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# libephemeris.dev_cli (the leph dev CLI) is intentionally excluded:
# it is repo tooling with repo-relative paths (tests/, scripts/, data/)
# that only works from a source checkout.
packages = [
    "libephemeris",
    "libephemeris.cli",
    "libephemeris.contrib",
    "libephemeris.data",
    "libephemeris.data.leb2",
    "libephemeris.moon_theories",
    "libephemeris.vendor",
]

[tool.setuptools.package-data]
libephemeris = ["py.typed", "data/*.csv", "data/leb2/base_core.leb2"]

# ---------------------------------------------------------------------------
# Poe shortcuts — curated aliases for the most common dev workflows.
# The full command set is available via the `leph` CLI (see: leph --help).
#
# All 120+ commands are accessible through `leph` with TAB completion.
# These poe shortcuts exist for muscle-memory convenience only.
#
# Naming convention:
#   test:<backend>:<variant>         — unit tests via <backend>
#
# Test matrix: every backend gets core / fast / full.
# ---------------------------------------------------------------------------

[tool.poe.tasks]

# Dev CLI launcher (leph is not a wheel entry point; see project.scripts)
leph = {cmd = "python -m libephemeris.dev_cli", help = "Run the leph dev CLI (poe leph -- <args>)"}

# --- Code quality ---
lint = {cmd = "python -m libephemeris.dev_cli code lint", help = "Lint all Python files (ruff, auto-fix)"}
format = {cmd = "python -m libephemeris.dev_cli code format", help = "Format all Python files (ruff)"}
typecheck = {cmd = "python -m libephemeris.dev_cli code typecheck", help = "Type-check libephemeris (mypy)"}

# --- Skyfield backend: core / fast / full ---
"test:skyfield:core" = {cmd = "python -m libephemeris.dev_cli test skyfield essential", help = "Skyfield essential ~900 tests, ~20s (parallel)"}
"test:skyfield:fast" = {cmd = "python -m libephemeris.dev_cli test skyfield unit-fast", help = "Skyfield unit tests ~16,000, ~1 min (parallel, no @slow)"}
"test:skyfield:full" = {cmd = "python -m libephemeris.dev_cli test skyfield all-full-fast", help = "Skyfield ALL tests including @slow (parallel)"}

# --- LEB backend: core / fast / full ---
"test:leb:core" = {cmd = "python -m libephemeris.dev_cli test leb-backend essential", help = "LEB essential ~900 tests, ~20s (parallel)"}
"test:leb:fast" = {cmd = "python -m libephemeris.dev_cli test leb-backend unit-fast", help = "LEB unit tests ~16,000, ~1 min (parallel, no @slow) [RECOMMENDED]"}
"test:leb:full" = {cmd = "python -m libephemeris.dev_cli test leb-backend unit-full", help = "LEB ALL unit tests including @slow (sequential)"}

# --- Horizons backend: core / fast / full ---
"test:horizons:core" = {cmd = "python -m libephemeris.dev_cli test horizons precision-quick", help = "Horizons quick precision check, 50 dates (~15s)"}
"test:horizons:fast" = {cmd = "python -m libephemeris.dev_cli test horizons precision", help = "Horizons precision 13 bodies, 200 dates (~45s)"}
"test:horizons:full" = {cmd = "python -m libephemeris.dev_cli test horizons vs-leb", help = "Horizons cross-validate against LEB2 (15 bodies, 100 dates)"}

# --- Coverage ---
coverage = {cmd = "python -m libephemeris.dev_cli test coverage run", help = "Tests with coverage reports (no @slow)"}

# --- LEB1 generation + verification (resumable group workflow) ---
"leb:generate:base" = {cmd = "python -m libephemeris.dev_cli leb generate base groups", help = "Generate base tier LEB via group workflow (resumable)"}
"leb:generate:medium" = {cmd = "python -m libephemeris.dev_cli leb generate medium groups", help = "Generate medium tier LEB via group workflow (resumable)"}
"leb:generate:extended" = {cmd = "python -m libephemeris.dev_cli leb generate extended groups", help = "Generate extended tier LEB via group workflow (resumable)"}
"leb:verify:base" = {cmd = "python -m libephemeris.dev_cli leb verify base", help = "Verify base tier LEB file vs Skyfield"}
"leb:verify:medium" = {cmd = "python -m libephemeris.dev_cli leb verify medium", help = "Verify medium tier LEB file vs Skyfield"}
"leb:verify:extended" = {cmd = "python -m libephemeris.dev_cli leb verify extended", help = "Verify extended tier LEB file vs Skyfield"}

# --- LEB2 conversion + verification ---
"leb2:convert:base" = {cmd = "python -m libephemeris.dev_cli leb2 convert base", help = "Convert base tier LEB1 -> LEB2 (all 5 body groups)"}
"leb2:convert:medium" = {cmd = "python -m libephemeris.dev_cli leb2 convert medium", help = "Convert medium tier LEB1 -> LEB2 (all 5 body groups)"}
"leb2:convert:extended" = {cmd = "python -m libephemeris.dev_cli leb2 convert extended", help = "Convert extended tier LEB1 -> LEB2 (all 5 body groups)"}
"leb2:verify:base" = {cmd = "python -m libephemeris.dev_cli leb2 verify base", help = "Verify base tier LEB2 vs LEB1 (<0.003\")"}
"leb2:verify:medium" = {cmd = "python -m libephemeris.dev_cli leb2 verify medium", help = "Verify medium tier LEB2 vs LEB1 (<0.003\")"}
"leb2:verify:extended" = {cmd = "python -m libephemeris.dev_cli leb2 verify extended", help = "Verify extended tier LEB2 vs LEB1 (<0.003\")"}

# --- Licensing / provenance gates (local poe tasks only; no CI) ---
"license:check" = {cmd = "python scripts/check_spdx_headers.py --check", help = "Verify SPDX headers on all shipped source files"}
"provenance:sweep" = {cmd = "python scripts/check_provenance.py", help = "Clean-room source/content and physical-worktree artifact sweep (zero-hit gate)"}
"provenance:hypothetical" = {cmd = "python scripts/check_hypothetical_provenance.py", help = "Verify Uranian/Transpluto elements trace to published sources (zero-mismatch gate)"}
"wheel:audit" = {cmd = "python scripts/check_wheel_contents.py", help = "Build the wheel and verify packaged contents"}

# pytest configuration lives in pytest.ini (single source of truth);
# a [tool.pytest.ini_options] section here would be silently ignored
# because pytest.ini takes precedence.

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.ruff]
# Vendored third-party sources retain their upstream formatting and license
# headers. Project-owned Python remains subject to both lint and format gates.
extend-exclude = ["libephemeris/vendor"]

[tool.ruff.lint]
# No global ignores: the former blanket F401/F403/F405/E402/F841 list hid
# real unused imports and variables everywhere.  Files that legitimately
# star-import or re-export get targeted exemptions below.

[tool.ruff.lint.per-file-ignores]
# Public API surface: re-exports (F401), star imports (F403/F405) and
# deliberate late imports after __version__ bootstrapping (E402).
"libephemeris/__init__.py" = ["F401", "F403", "F405", "E402"]
# Star-imports the constants module by design (late, after the typed
# explicit imports — E402 is the documented layout there).
"libephemeris/planets.py" = ["F403", "F405", "E402"]
# Test modules conventionally star-import the package/constants; unused
# locals in tests (ignored tuple components etc.) are accepted noise;
# E402 covers the pytest.importorskip()-before-import pattern.
"tests/*" = ["F403", "F405", "F841", "E402"]
# conftest files re-import fixtures from sibling conftests to register
# them — those imports look unused but are load-bearing for pytest.
"tests/**/conftest.py" = ["F401", "F403", "F405"]
# Re-exports the legacy MOON_*/NAIF_* ids for backward compatibility.
"libephemeris/planetary_moons.py" = ["F401"]
# Test bootstrap star-imports the package to expose every symbol.
"tests/conftest.py" = ["F403", "F405"]
# Star-imports the constants module by design.
"libephemeris/houses.py" = ["F403", "F405"]
# Standalone scripts insert the repo root on sys.path before importing.
"scripts/*" = ["E402"]

[tool.coverage.run]
source = ["libephemeris"]
branch = true
parallel = true
omit = [
    "libephemeris/__pycache__/*",
    # Out of scope for the 100% target: dev tooling, interactive wizard, vendored code.
    "libephemeris/dev_cli/*",          # dev tooling (leph CLI), not shipped behavior
    "libephemeris/cli/*",              # interactive init wizard
    "libephemeris/vendor/*",           # vendored third-party (spktype21)
    # Generated data tables (pure coefficients, no logic to exercise).
    "libephemeris/lunar_apse_corrections.py",
    "libephemeris/multi_epoch_data.py",
    "libephemeris/lunar_corrections.py",
    "libephemeris/true_node_terms.py",
    "libephemeris/star_catalog_gen.py",
    "libephemeris/moon_theories/tass17_data.py",
]

[tool.coverage.paths]
source = [
    "libephemeris/",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 2

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"
