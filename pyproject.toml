[build-system]
requires = ["maturin==1.9.4"]
build-backend = "maturin"

[project]
name = "libephemeris"
dynamic = ["version"]
description = "Astrological ephemerides and astronomical calculations powered by Rust"
readme = "README.md"
keywords = ["astrology", "ephemeris", "astronomy", "jpl", "astrometry", "planetary"]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]
license = "AGPL-3.0"
license-files = ["COPYING", "THIRD_PARTY_NOTICES.md", "core/licenses/**/*"]
authors = [
    { name = "Giacomo Battaglia", email = "kerykeion.astrology@gmail.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/g-battaglia/libephemeris"
Repository = "https://github.com/g-battaglia/libephemeris"
Documentation = "https://github.com/g-battaglia/libephemeris/blob/python-v4.0.0/docs/README.md"
Issues = "https://github.com/g-battaglia/libephemeris/issues"
Changelog = "https://github.com/g-battaglia/libephemeris/blob/python-v4.0.0/CHANGELOG.md"

[dependency-groups]
test = ["pytest>=8", { include-group = "generate" }, { include-group = "catalog" }]
generate = ["libephemeris-leb-tools==4.0.0b1"]
catalog = ["astroquery==0.4.11"]
examples = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
docs = ["sphinx>=8,<10", "myst-parser>=4,<6", "sphinx-rtd-theme>=3,<4"]
release = ["maturin==1.9.4", "twine>=6,<8", "build>=1.2,<2"]

[tool.uv.sources]
libephemeris-leb-tools = { path = "tools/leb_generation" }

[project.scripts]
libephemeris = "libephemeris._core:cli_main"

[tool.maturin]
manifest-path = "python/Cargo.toml"
python-source = "python"
module-name = "libephemeris._core"
bindings = "pyo3"
features = ["pyo3/extension-module"]
include = [
    { path = "*.md", format = "sdist" },
    { path = "AUTHORS", format = "sdist" },
    { path = "python/libephemeris/data/**", format = ["wheel", "sdist"] },
    { path = "python/tests/**", format = "sdist" },
    { path = "python/examples/**/*.py", format = "sdist" },
    { path = "tools/**/*.py", format = "sdist" },
    { path = "tools/**/*.toml", format = "sdist" },
    { path = "tools/**/*.md", format = "sdist" },
    { path = "tools/leb_generation/COPYING", format = "sdist" },
    { path = "tools/generators/data/*", format = "sdist" },
    { path = "docs/**/*.md", format = "sdist" },
    { path = "beginners-manual/**/*.md", format = "sdist" },
    { path = "beginners-manual/**/*.yaml", format = "sdist" },
    { path = "beginners-manual/COPYING*", format = "sdist" },
    { path = "docs/**/*.rst", format = "sdist" },
    { path = "docs/**/*.py", format = "sdist" },
    { path = "python/libephemeris/*.pyi", format = ["wheel", "sdist"] },
    { path = "python/libephemeris/py.typed", format = ["wheel", "sdist"] },
]
exclude = [
    "docs/_build/**",
    "tools/leb_generation/build/**",
    "tools/leb_generation/*.egg-info/**",
    "**/__pycache__/**",
    "target/**",
    "dist/**",
    "build/**",
    ".venv*/**",
    "libephemeris-validation-python/**",
    "python/libephemeris/*.so",
    "python/libephemeris/*.pyd",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
