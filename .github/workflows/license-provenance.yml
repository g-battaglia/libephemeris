name: license-provenance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SPDX license headers
        run: python scripts/check_spdx_headers.py --check

      - name: Provenance sweep (Swiss Ephemeris fingerprints)
        run: python scripts/check_provenance.py

      - name: Wheel content audit
        run: |
          python -m pip install --quiet build
          python scripts/check_wheel_contents.py
