[package]
name = "libephemeris-python"
version = "4.0.0-beta.1"
edition = "2024"
rust-version = "1.86"
license = "AGPL-3.0"
description = "Minimal Python bindings for the LibEphemeris Rust engine"
repository = "https://github.com/g-battaglia/libephemeris"
# Only the root core crate belongs on crates.io; this crate builds the PyPI extension.
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
# Compatible alias for callers of the former opt-in Rust engine.
native-nbody = ["libephemeris-core/native-nbody"]

[dependencies]
libephemeris-core = { path = "../core", version = "=1.0.0-beta.1", default-features = false, features = ["bundled-data", "nbody", "python-internals"] }
pyo3 = { version = "=0.29.3", features = ["abi3-py312"] }
pyo3-log = "=0.13.4"
numpy = "=0.29.0"
